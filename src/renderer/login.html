<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodingKida</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      background: #0d0b1e;
      color: #fff;
    }

    /* Background Effects */
    .bg-effects {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.35;
      animation: float 8s ease-in-out infinite;
    }
    .blob-1 { width: 500px; height: 500px; background: #3730a3; top: -150px; left: -100px; }
    .blob-2 { width: 400px; height: 400px; background: #4338ca; bottom: -100px; right: 5%; animation-delay: 2s; }
    .blob-3 { width: 350px; height: 350px; background: #6366f1; top: 35%; right: -80px; animation-delay: 4s; }
    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(20px, 20px); }
    }
    /* Grid lines */
    .grid-h {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image:
        linear-gradient(rgba(99,102,241,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.07) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    /* Perspective grid at bottom */
    .grid-perspective {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 45%;
      background-image:
        linear-gradient(rgba(99,102,241,0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.06) 1px, transparent 1px);
      background-size: 80px 40px;
      transform: perspective(400px) rotateX(55deg);
      transform-origin: bottom center;
      opacity: 0.5;
      mask-image: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
      -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
    }
    /* SVG wireframe shapes */
    .cyber-svg {
      position: absolute;
      opacity: 0.12;
    }
    .cyber-svg-1 { top: 8%; left: 3%; width: 180px; }
    .cyber-svg-2 { bottom: 10%; right: 3%; width: 160px; transform: rotate(180deg); }
    .cyber-svg-3 { top: 45%; left: 42%; width: 120px; opacity: 0.07; }

    /* Corner brackets */
    .corner {
      position: absolute;
      width: 40px;
      height: 40px;
      opacity: 0.25;
    }
    .corner-tl { top: 16px; left: 16px; border-top: 1.5px solid #6366f1; border-left: 1.5px solid #6366f1; }
    .corner-tr { top: 16px; right: 16px; border-top: 1.5px solid #6366f1; border-right: 1.5px solid #6366f1; }
    .corner-bl { bottom: 16px; left: 16px; border-bottom: 1.5px solid #6366f1; border-left: 1.5px solid #6366f1; }
    .corner-br { bottom: 16px; right: 16px; border-bottom: 1.5px solid #6366f1; border-right: 1.5px solid #6366f1; }
    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #fff;
      border-radius: 50%;
      animation: twinkle 3s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.9; }
    }
    .star:nth-child(1) { top: 20%; left: 15%; animation-delay: 0s; }
    .star:nth-child(2) { top: 60%; left: 25%; animation-delay: 1s; }
    .star:nth-child(3) { top: 40%; left: 70%; animation-delay: 2s; }
    .star:nth-child(4) { top: 80%; left: 80%; animation-delay: 1.5s; }

    /* Layout */
    .container {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      z-index: 1;
    }

    /* Left Panel */
    .left-panel {
      width: 38%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px;
      position: relative;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 48px;
      font-size: 30px;
      font-weight: 700;
    }
    .logo-icon {
      font-size: 32px;
      background: #6d28d9;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
    }
    .logo-text { color: #fff; }
    .hero-title {
      font-size: 48px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 20px;
    }
    .hero-title .highlight { color: #6366f1; display: block; }
    .hero-desc {
      font-size: 16px;
      line-height: 1.6;
      color: #94a3b8;
      margin-bottom: 40px;
      max-width: 480px;
    }
    .avatar-card {
      background: rgba(26, 24, 48, 0.6);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 32px;
      max-width: 480px;
    }
    .avatar-group {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }
    .avatars {
      display: flex;
      margin-right: 8px;
    }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      border: 2px solid #0d0b1e;
      margin-left: -12px;
    }
    .avatar:first-child { margin-left: 0; }
    .avatar-1 { background: #ef4444; }
    .avatar-2 { background: #8b5cf6; }
    .avatar-3 { background: #3b82f6; }
    .avatar-4 { background: #10b981; }
    .avatar-5 { background: #f59e0b; }
    .avatar-text {
      font-size: 14px;
      font-weight: 600;
      color: #e2e8f0;
    }
    .rating {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }
    .stars { color: #fbbf24; }
    .rating-text { color: #94a3b8; }
    .stats-row {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 14px;
      color: #94a3b8;
      max-width: 480px;
    }
    .stat-divider {
      width: 1px;
      height: 16px;
      background: rgba(255,255,255,0.2);
    }


    .right-panel {
      width: calc(55% - 1px);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-left: 60px;
    }
    .login-card-wrapper {
      width: 420px;
    }
    .login-card {
      background: #1a1830;
      border-radius: 16px;
      padding: 40px;
      width: 420px;
      max-width: 420px;
      box-sizing: border-box;
    }
    .card-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #fff;
    }
    .card-subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 28px;
    }
    .error-box {
      display: none;
      width: 100%;
      box-sizing: border-box;
      background: rgba(220,38,38,0.15);
      border: 1px solid rgba(220,38,38,0.4);
      border-radius: 8px;
      padding: 12px;
      color: #fca5a5;
      font-size: 13px;
      margin-bottom: 20px;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #e2e8f0;
    }
    .forgot-link {
      color: #6366f1;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .forgot-link:hover { text-decoration: underline; }
    .input-wrapper {
      position: relative;
      width: 100%;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 16px;
    }
    .form-input {
      width: 100%;
      box-sizing: border-box;
      display: block;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 14px 14px 14px 44px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus { border-color: #6366f1; }
    .form-input::placeholder { color: #64748b; }
    .password-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .password-toggle:hover { color: #94a3b8; }
    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
    }
    .checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #6d28d9;
    }
    .checkbox-label {
      font-size: 13px;
      color: #94a3b8;
      cursor: pointer;
    }
    .login-btn {
      width: 100%;
      background: #6d28d9;
      border: none;
      border-radius: 10px;
      padding: 14px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .login-btn:hover { background: #5b21b6; }
    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .trust-bar {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .trust-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Icons */
    .icon-mail::before { content: '✉'; }
    .icon-lock::before { content: '🔒'; }
    .icon-eye::before { content: '👁'; }
    .icon-eye-off::before { content: '👁‍🗨'; }
  </style>
</head>
<body>
  <div class="bg-effects">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="grid-h"></div>
    <div class="grid-perspective"></div>
<div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>
    <!-- Wireframe hexagon -->
    <svg class="cyber-svg cyber-svg-1" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <polygon points="100,10 190,55 190,145 100,190 10,145 10,55" stroke="#6366f1" stroke-width="1"/>
      <polygon points="100,35 165,70 165,130 100,165 35,130 35,70" stroke="#6366f1" stroke-width="0.5"/>
      <line x1="100" y1="10" x2="100" y2="190" stroke="#6366f1" stroke-width="0.5"/>
      <line x1="10" y1="55" x2="190" y2="145" stroke="#6366f1" stroke-width="0.5"/>
      <line x1="190" y1="55" x2="10" y2="145" stroke="#6366f1" stroke-width="0.5"/>
    </svg>
    <!-- Wireframe diamond -->
    <svg class="cyber-svg cyber-svg-2" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
      <polygon points="80,5 155,80 80,155 5,80" stroke="#4338ca" stroke-width="1"/>
      <polygon points="80,30 130,80 80,130 30,80" stroke="#4338ca" stroke-width="0.5"/>
      <line x1="80" y1="5" x2="80" y2="155" stroke="#4338ca" stroke-width="0.5"/>
      <line x1="5" y1="80" x2="155" y2="80" stroke="#4338ca" stroke-width="0.5"/>
    </svg>
    <!-- Center subtle circle -->
    <svg class="cyber-svg cyber-svg-3" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="60" cy="60" r="55" stroke="#6366f1" stroke-width="0.5" stroke-dasharray="4 6"/>
      <circle cx="60" cy="60" r="35" stroke="#6366f1" stroke-width="0.5"/>
      <circle cx="60" cy="60" r="3" fill="#6366f1"/>
    </svg>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
  </div>

  <div class="container">
    <!-- Left Panel -->
    <div class="left-panel">
      <div class="logo">
        <img src="assets/logo.png" alt="CodingKida" style="width:64px;height:64px;border-radius:14px;object-fit:cover;">
        <div class="logo-text" style="font-size:32px;">Coding<span style="color:#ef4444">K</span><span style="color:#f59e0b">i</span><span style="color:#22c55e">d</span>a</div>
      </div>

      <h1 class="hero-title">
        Learn Today,
        <span class="highlight">Build Tomorrow.</span>
      </h1>

      <p class="hero-desc">
        Beyond Coding. Into Intelligence. Real projects, expert mentors, and a community that grows with you.
      </p>

      <div class="stats-row">
        <span>10+ Courses</span>
      </div>
    </div>

    <!-- Right Panel -->
    <div class="right-panel">
      <div class="login-card-wrapper">
      <div class="login-card">
        <h2 class="card-title">Welcome back</h2>
        <p class="card-subtitle">Log in to continue learning</p>

        <div id="error-box" class="error-box"></div>

        <form id="login-form" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label class="form-label">Email</label>
            <div class="input-wrapper">
              <span class="input-icon icon-mail"></span>
              <input
                type="email"
                id="email"
                class="form-input"
                placeholder="you@example.com"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">
              <span>Password</span>
              <a class="forgot-link" onclick="handleForgotPassword()">Forgot password?</a>
            </label>
            <div class="input-wrapper">
              <span class="input-icon icon-lock"></span>
              <input
                type="password"
                id="password"
                class="form-input"
                placeholder="••••••••"
                required
              />
              <button type="button" class="password-toggle" onclick="togglePassword()">
                <span id="eye-icon" class="icon-eye"></span>
              </button>
            </div>
          </div>

          <div class="checkbox-wrapper">
            <input type="checkbox" id="remember" class="checkbox" />
            <label for="remember" class="checkbox-label">Remember me for 30 days</label>
          </div>

          <button type="submit" class="login-btn" id="login-btn">
            <span>→</span>
            <span>Log In</span>
          </button>

          <!-- Divider -->
          <div style="display:flex;align-items:center;gap:10px;margin:20px 0;">
            <div style="flex:1;height:1px;background:rgba(255,255,255,0.1);"></div>
            <span style="font-size:12px;color:#64748b;">or login with email OTP</span>
            <div style="flex:1;height:1px;background:rgba(255,255,255,0.1);"></div>
          </div>

          <!-- OTP Login -->
          <div id="otp-section">
            <div class="input-wrapper" style="margin-bottom:10px;">
              <span class="input-icon icon-mail"></span>
              <input type="email" id="otp-email" class="form-input" placeholder="Enter your email for OTP"/>
            </div>
            <div id="otp-code-section" style="display:none;margin-bottom:10px;">
              <input type="text" id="otp-code" class="form-input" placeholder="Enter 6-digit OTP" maxlength="6" style="text-align:center;letter-spacing:8px;font-size:18px;font-weight:700;padding-left:14px;"/>
            </div>
            <div id="otp-msg" style="display:none;font-size:12px;margin-bottom:10px;padding:8px;border-radius:8px;"></div>
            <button type="button" id="otp-btn" onclick="handleOtpLogin()" style="width:100%;background:rgba(108,71,255,0.15);border:1px solid rgba(108,71,255,0.4);border-radius:10px;padding:12px;color:#a78bfa;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.2s;" onmouseover="this.style.background='rgba(108,71,255,0.25)'" onmouseout="this.style.background='rgba(108,71,255,0.15)'">
              <span>📧</span> Send OTP
            </button>
            <div id="otp-cancel" style="display:none;text-align:center;margin-top:8px;">
              <a onclick="resetOtpFlow()" style="font-size:12px;color:#64748b;cursor:pointer;text-decoration:underline;">Cancel — use password login instead</a>
            </div>
          </div>
        </form>

        <div class="trust-bar">
          <div class="trust-item">🔒 Secure</div>
          <div class="trust-item">🔐 Encrypted</div>
        </div>
      </div>
      </div>
    </div>
  </div>

  <script>
    // Toggle password visibility
    function togglePassword() {
      const input = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'icon-eye-off';
      } else {
        input.type = 'password';
        icon.className = 'icon-eye';
      }
    }

    // Handle forgot password
    function handleForgotPassword() {
      if (window.electron && window.electron.ipcRenderer) {
        window.electron.ipcRenderer.invoke('open-external', 'https://www.codingkida.com/login');
      } else {
        window.open('https://www.codingkida.com/login', '_blank');
      }
    }

    // Handle Google Login — replaced with OTP login
    var _otpStep = 'email'; // 'email' or 'verify'
    var _otpEmail = '';

    async function handleOtpLogin() {
      var msg = document.getElementById('otp-msg');
      var btn = document.getElementById('otp-btn');

      if (_otpStep === 'email') {
        // Step 1: Send OTP
        var email = document.getElementById('otp-email').value.trim();
        if (!email || !email.includes('@')) {
          msg.style.display = 'block'; msg.style.color = '#fca5a5'; msg.style.background = 'rgba(220,38,38,0.15)';
          msg.textContent = 'Please enter a valid email address.';
          return;
        }
        btn.disabled = true; btn.innerHTML = '<span>⏳</span> Sending OTP...';
        msg.style.display = 'none';
        try {
          var BASE = (window.__APP_CONFIG__ && window.__APP_CONFIG__.API_BASE_URL) || 'https://www.codingkida.com';
          var res = await fetch(BASE + '/api/auth/send-otp', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email }),
          });
          var data = await res.json();
          if (data.success) {
            _otpStep = 'verify';
            _otpEmail = email;
            document.getElementById('otp-code-section').style.display = 'block';
            document.getElementById('otp-email').disabled = true;
            btn.innerHTML = '<span>✓</span> Verify OTP';
            btn.disabled = false;
            msg.style.display = 'block'; msg.style.color = '#86efac'; msg.style.background = 'rgba(34,197,94,0.15)';
            msg.textContent = 'OTP sent to ' + email + '. Check your inbox.';
            document.getElementById('otp-code').focus();
            document.getElementById('otp-cancel').style.display = 'block';
          } else {
            msg.style.display = 'block'; msg.style.color = '#fca5a5'; msg.style.background = 'rgba(220,38,38,0.15)';
            msg.textContent = data.message || 'Failed to send OTP.';
            btn.disabled = false; btn.innerHTML = '<span>📧</span> Send OTP';
          }
        } catch (err) {
          msg.style.display = 'block'; msg.style.color = '#fca5a5'; msg.style.background = 'rgba(220,38,38,0.15)';
          msg.textContent = 'Network error. Please check your connection.';
          btn.disabled = false; btn.innerHTML = '<span>📧</span> Send OTP';
        }
      } else {
        // Step 2: Verify OTP
        var otp = document.getElementById('otp-code').value.trim();
        if (!otp || otp.length !== 6) {
          msg.style.display = 'block'; msg.style.color = '#fca5a5'; msg.style.background = 'rgba(220,38,38,0.15)';
          msg.textContent = 'Please enter the 6-digit OTP.';
          return;
        }
        btn.disabled = true; btn.innerHTML = '<span>⏳</span> Verifying...';
        msg.style.display = 'none';
        try {
          var BASE = (window.__APP_CONFIG__ && window.__APP_CONFIG__.API_BASE_URL) || 'https://www.codingkida.com';
          var res = await fetch(BASE + '/api/auth/verify-otp', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: _otpEmail, otp: otp }),
          });
          var data = await res.json();
          if (data.success && data.token) {
            // Login success — store token directly and load main app
            btn.innerHTML = '<span>✓</span> Success!';
            if (window.electron && window.electron.ipcRenderer) {
              await window.electron.ipcRenderer.invoke('otp-login-complete', {
                token: data.token,
                user: data.user,
                remember: true,
              });
            } else {
              localStorage.setItem('ck_token', data.token);
              localStorage.setItem('ck_user', JSON.stringify(data.user));
            }
          } else {
            msg.style.display = 'block'; msg.style.color = '#fca5a5'; msg.style.background = 'rgba(220,38,38,0.15)';
            msg.textContent = data.message || 'Invalid OTP.';
            btn.disabled = false; btn.innerHTML = '<span>✓</span> Verify OTP';
          }
        } catch (err) {
          msg.style.display = 'block'; msg.style.color = '#fca5a5'; msg.style.background = 'rgba(220,38,38,0.15)';
          msg.textContent = 'Network error. Please try again.';
          btn.disabled = false; btn.innerHTML = '<span>✓</span> Verify OTP';
        }
      }
    }

    function resetOtpFlow() {
      _otpStep = 'email';
      _otpEmail = '';
      document.getElementById('otp-email').value = '';
      document.getElementById('otp-email').disabled = false;
      document.getElementById('otp-code-section').style.display = 'none';
      document.getElementById('otp-code').value = '';
      document.getElementById('otp-msg').style.display = 'none';
      document.getElementById('otp-cancel').style.display = 'none';
      var btn = document.getElementById('otp-btn');
      btn.disabled = false;
      btn.innerHTML = '<span>📧</span> Send OTP';
    }

    // Handle login
    async function handleLogin(event) {
      event.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const remember = document.getElementById('remember').checked;
      const errorBox = document.getElementById('error-box');
      const loginBtn = document.getElementById('login-btn');

      // Hide previous errors
      errorBox.style.display = 'none';

      // Disable button
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span>⏳</span><span>Logging in...</span>';

      try {
        // Call Electron IPC if available
        if (window.electron && window.electron.ipcRenderer) {
          const response = await window.electron.ipcRenderer.invoke('login', {
            email,
            password,
            remember
          });

          if (response.success) {
            // Success - main process will load index.html
            loginBtn.innerHTML = '<span>✓</span><span>Success!</span>';
          } else {
            throw new Error(response.message || 'Login failed');
          }
        } else {
          throw new Error('Electron IPC not available');
        }
      } catch (error) {
        // Show error
        errorBox.textContent = error.message || 'Failed to execute \'fetch\' on \'Window\': Failed to parse URL from http://localhost:3000/api/auth/login';
        errorBox.style.display = 'block';
        
        // Re-enable button
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<span>→</span><span>Log In</span>';
      }
    }
  </script>
</body>
</html>
